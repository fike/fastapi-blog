[tool.poetry]
name = "blog"
version = "0.1.0"
description = "a fastapi blog"
authors = ["Fernando Ike"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.13"
alembic = "^1.14.0"
fastapi = ">=0.136.1"
httpx = "^0.28.0"
uvicorn = "^0.40.0"
psycopg2-binary = "^2.9.11"

fastapi-pagination = "^0.15.0"
python-slugify = "^8.0.0"
passlib = "^1.7.4"
python-jose = "^3.3.0"
python-multipart = "^0.0.27"
pydantic = ">=2.10.0"
pydantic-settings = ">=2.7.0"
SQLAlchemy = "^2.0.0"
opentelemetry-exporter-otlp = "^1.39.0"
opentelemetry-api = "^1.39.0"
opentelemetry-sdk = "^1.39.0"
opentelemetry-instrumentation-requests = "^0.60b0"
opentelemetry-instrumentation-fastapi = "^0.60b0"
opentelemetry-instrumentation-sqlalchemy = "^0.60b0"


[tool.poetry.group.dev.dependencies]
autopep8 = "^1.5.5"
coverage = "^5.3.1"
pytest = "^6.2.1"
pytest-order = "^0.9.5"
pylint = "^3.0.0"
ruff = "^0.9.6"
requests = "^2.33.0"
black = "^26.3.1"
pre-commit = "^4.6.0"
virtualenv = "^21.3.3"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
   \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # The following are specific to Black, you probably don't want those.
  | blib2to3
  |  tests
  | profiling
)/
'''

[tool.isort]
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 79
profile = "black"
multi_line_output = 3
known_third_party = ["alembic", "fastapi", "fastapi_pagination", "jose", "opentelemetry", "passlib", "pydantic", "pytest", "requests", "slugify", "sqlalchemy", "starlette"]
